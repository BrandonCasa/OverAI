[project]
name = "overai"
version = "0.1.0"
description = "Hierarchical supervised imitation controller for classic games"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate",
    "einops",
    "nvidia-ml-py",
    "onnx>=1.18",
    "onnxscript>=0.4",
    "safetensors",
    "torch",
    "torchvision",
    "triton-windows>=3.7,<3.8; sys_platform == 'win32'",
    "transformers",
    "torchao>=0.17.0",
]

[project.scripts]
overai-benchmark = "overai.benchmark:main"
overai-synthetic = "overai.synthetic:main"
overai-train = "overai.training:main"
overai-distill = "overai.distillation:main"
overai-record = "overai.recording:record_main"
overai-finalize-dataset = "overai.recording:finalize_main"
overai-export-rtx = "overai.rtx:export_main"
overai-benchmark-rtx = "overai.rtx:benchmark_main"
overai-run-rtx = "overai.rtx:run_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
recording = [
    "windows-capture>=1.0.45; sys_platform == 'win32'",
]
rtx = [
    "tensorrt-rtx==1.5.0.114; sys_platform == 'win32' and python_version < '3.14'",
]
