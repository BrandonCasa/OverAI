[project]
name = "overai"
version = "0.1.0"
description = "Hierarchical supervised imitation controller for classic games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "einops",
    "nvidia-ml-py",
    "safetensors",
    "torch",
    "torchvision",
    "transformers",
]

[project.scripts]
overai-benchmark = "overai.benchmark:main"
overai-synthetic = "overai.synthetic:main"
overai-train = "overai.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
